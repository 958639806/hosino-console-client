<title>请更新 Android System WebView</title>
<style>body{font:16px/1.8 sans-serif;padding:32px;max-width:560px;margin:auto;background:#f3f5f8;color:#202732}h1{font-size:24px}</style>
<h1>应用界面暂时无法加载</h1>
<p>Hosino Console 需要 Android System WebView 或 Chrome 105 及以上版本。请更新系统 WebView 后重新打开应用。</p>
<p>如果已经更新，请尝试重新启动应用；问题持续时可重新安装对应版本的安装包。</p>
